
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0877c9">
<title>Vroom Vroom Kids</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#eaf6ff;color:#18324b}
header{background:linear-gradient(120deg,#0877c9,#35b9e8);color:white;text-align:center;padding:22px 12px}
header h1{margin:0;font-size:29px}
header p{margin:8px 0 0}
.wrap{max-width:850px;margin:auto;padding:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.tabs button,.btn{border:0;border-radius:22px;padding:11px 16px;background:#fff;color:#1269a8;font-weight:bold;white-space:nowrap;box-shadow:0 2px 7px #0001}
.tabs button.active,.btn.primary{background:#0877c9;color:white}
.card{background:white;border-radius:22px;padding:16px;box-shadow:0 5px 18px #1a5b8520;margin-top:12px;text-align:center}
.counter{color:#55738b;font-weight:bold}
.photoBox{height:300px;background:#f0f7fc;border-radius:17px;margin:14px 0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.photoBox img{width:100%;height:100%;object-fit:contain;display:none}
#loading{font-size:17px;color:#55738b;padding:20px}
#vehicleName{font-size:30px;color:#0877c9;margin:8px}
#hindiName{font-size:24px;color:#ed7a17;margin:5px}
#description{font-size:16px;line-height:1.5;color:#496276}
.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.btn{background:#e5f3ff;color:#1269a8;cursor:pointer}
.btn.primary{background:#0877c9;color:white}
.btn.orange{background:#ff9c31;color:white}
.btn.green{background:#1caa72;color:white}
.credit{font-size:11px;color:#789;margin-top:8px}
.stats{display:flex;justify-content:space-around;gap:8px;margin-top:14px}
.stat{background:#f0f8ff;border-radius:13px;padding:12px;flex:1}
.stat b{display:block;font-size:22px;color:#0877c9}
.quizQuestion{font-size:20px;font-weight:bold;margin:12px}
.option{display:block;width:100%;margin:8px 0;padding:13px;border:2px solid #d8eaf7;border-radius:13px;background:white;font-size:16px}
footer{text-align:center;padding:20px;color:#789;font-size:13px}
</style>
</head>
<body>
<header>
<h1>🚘 Vroom Vroom Kids</h1>
<p>Let's learn vehicles – गाड़ियों को पहचानें और सीखें!</p>
</header>

<div class="wrap">
<div class="tabs" id="tabs"></div>

<div class="card">
<div class="counter" id="counter">Loading...</div>
<div class="photoBox">
<div id="loading">तस्वीर खोजी जा रही है...</div>
<img id="vehiclePhoto" alt="Vehicle photo">
</div>
<div id="vehicleName">Vehicle</div>
<div id="hindiName">वाहन</div>
<div id="description"></div>
<div class="credit" id="credit"></div>

<div class="controls">
<button class="btn" onclick="previousVehicle()">◀ Previous</button>
<button class="btn primary" onclick="nextVehicle()">Next ▶</button>
</div>
<div class="controls">
<button class="btn orange" onclick="askMe()">🔊 Ask Me</button>
<button class="btn green" onclick="tellMe()">🗣 Tell Me</button>
<button class="btn" onclick="repeatVoice()">🔁 Repeat</button>
<button class="btn" onclick="toggleAuto()" id="autoButton">▶ Auto Learning</button>
</div>
</div>

<div class="card">
<h2>⭐ My Learning Corner</h2>
<div class="stats">
<div class="stat"><b id="learned">0</b>Learned</div>
<div class="stat"><b id="total">50</b>Total Vehicles</div>
</div>
</div>

<div class="card">
<h2>🎯 Guess the Vehicle!</h2>
<p id="quizQuestion" class="quizQuestion">इस वाहन को पहचानिए।</p>
<div id="quizOptions"></div>
<p id="quizResult"></p>
<button class="btn primary" onclick="newQuiz()">Next Question</button>
</div>
</div>

<footer>Made with ❤️ for Little Learners | Vroom Vroom Kids</footer>

<script>
const vehicles = [
["Car","कार","A car carries people on roads.","Road","car automobile vehicle"],
["Bus","बस","A bus carries many passengers.","Road","bus public transport"],
["Truck","ट्रक","A truck carries heavy goods.","Road","truck lorry"],
["Bicycle","साइकिल","A bicycle has two wheels.","Road","bicycle cycle"],
["Motorcycle","मोटरसाइकिल","A motorcycle has two wheels and an engine.","Road","motorcycle motorbike"],
["Scooter","स्कूटर","A scooter is a two-wheeler.","Road","scooter vehicle"],
["Auto Rickshaw","ऑटो रिक्शा","An auto rickshaw carries passengers.","Road","auto rickshaw tuk tuk"],
["Taxi","टैक्सी","A taxi takes people to places.","Road","taxi cab car"],
["Ambulance","एम्बुलेंस","An ambulance takes sick people to hospital.","Special","ambulance vehicle"],
["Fire Engine","दमकल","A fire engine helps put out fires.","Special","fire engine fire truck"],
["Police Car","पुलिस कार","A police car helps keep people safe.","Special","police car vehicle"],
["Tractor","ट्रैक्टर","A tractor helps farmers in fields.","Work","tractor farm"],
["JCB","जेसीबी","A JCB digs and moves soil.","Work","JCB excavator digger"],
["Bulldozer","बुलडोजर","A bulldozer pushes soil and rocks.","Work","bulldozer construction"],
["Road Roller","रोड रोलर","A road roller makes roads smooth.","Work","road roller construction"],
["Train","ट्रेन","A train runs on railway tracks.","Rail","passenger train railway"],
["Metro","मेट्रो","A metro train carries people in cities.","Rail","metro train subway"],
["Steam Locomotive","भाप का इंजन","A steam locomotive runs using steam.","Rail","steam locomotive train"],
["Goods Train","मालगाड़ी","A goods train carries cargo.","Rail","freight train goods train"],
["Bullet Train","बुलेट ट्रेन","A bullet train travels very fast.","Rail","high speed bullet train"],
["Aeroplane","हवाई जहाज","An aeroplane flies in the sky.","Air","passenger airplane aircraft"],
["Helicopter","हेलीकॉप्टर","A helicopter can fly up and down.","Air","helicopter aircraft"],
["Fighter Jet","लड़ाकू विमान","A fighter jet is a fast military aircraft.","Air","fighter jet aircraft"],
["Hot Air Balloon","गर्म हवा का गुब्बारा","A hot air balloon floats in the sky.","Air","hot air balloon"],
["Glider","ग्लाइडर","A glider flies without an engine.","Air","glider aircraft"],
["Ship","जहाज","A ship travels on water.","Water","cargo ship ocean"],
["Boat","नाव","A boat travels on water.","Water","small boat river"],
["Sailboat","पाल वाली नाव","A sailboat moves with the wind.","Water","sailboat sailing"],
["Submarine","पनडुब्बी","A submarine travels underwater.","Water","submarine underwater"],
["Ferry","फेरी","A ferry carries people across water.","Water","ferry boat passenger"],
["Yacht","यॉट","A yacht is a pleasure boat.","Water","yacht boat"],
["Canoe","डोंगी","A canoe is a narrow small boat.","Water","canoe boat"],
["Rocket","रॉकेट","A rocket travels into space.","Air","space rocket launch"],
["Space Shuttle","अंतरिक्ष यान","A space shuttle travels into space.","Air","space shuttle spacecraft"],
["Tank","टैंक","A tank is a military vehicle.","Special","military tank vehicle"],
["Jeep","जीप","A jeep can travel on rough roads.","Road","jeep off road vehicle"],
["Van","वैन","A van carries people or goods.","Road","van vehicle"],
["Pickup Truck","पिकअप ट्रक","A pickup truck carries goods.","Road","pickup truck"],
["School Bus","स्कूल बस","A school bus takes children to school.","Road","yellow school bus"],
["Electric Car","इलेक्ट्रिक कार","An electric car runs on battery power.","Road","electric car vehicle"],
["Garbage Truck","कचरा गाड़ी","A garbage truck collects waste.","Work","garbage truck refuse vehicle"],
["Cement Mixer","सीमेंट मिक्सर","A cement mixer mixes concrete.","Work","concrete mixer truck"],
["Crane","क्रेन","A crane lifts heavy things.","Work","mobile crane construction"],
["Forklift","फोर्कलिफ्ट","A forklift lifts and moves heavy loads.","Work","forklift warehouse"],
["Snowmobile","स्नोमोबाइल","A snowmobile travels over snow.","Special","snowmobile vehicle"],
["Golf Cart","गोल्फ कार्ट","A golf cart is a small vehicle.","Road","golf cart"],
["Rickshaw","रिक्शा","A rickshaw carries passengers.","Road","cycle rickshaw"],
["Horse Carriage","घोड़ा गाड़ी","A horse pulls this carriage.","Special","horse drawn carriage"],
["Cable Car","केबल कार","A cable car travels on cables.","Special","cable car mountain"],
["Monorail","मोनोरेल","A monorail runs on one rail.","Rail","monorail train"]
];

const categories=["All","Road","Rail","Air","Water","Work","Special"];
let current=0, filtered=[...vehicles], autoTimer=null, quizAnswer=null;
let learnedSet=new Set();
let lastSpeech="";

const photo=document.getElementById("vehiclePhoto");
const loading=document.getElementById("loading");
const nameEl=document.getElementById("vehicleName");
const hindiEl=document.getElementById("hindiName");
const descEl=document.getElementById("description");
const creditEl=document.getElementById("credit");

function makeTabs(){
 const tabs=document.getElementById("tabs");
 tabs.innerHTML="";
 categories.forEach(cat=>{
  const b=document.createElement("button");
  b.textContent=cat==="All"?"All Vehicles":cat;
  if(cat==="All")b.classList.add("active");
  b.onclick=()=>{
   document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
   b.classList.add("active");
   filtered=cat==="All"?[...vehicles]:vehicles.filter(v=>v[3]===cat);
   current=0;showVehicle();
  };
  tabs.appendChild(b);
 });
}

// PHOTO CACHE: पहले सेव की हुई फोटो इस्तेमाल होगी
async function findPhoto(searchTerm){
 const cacheKey="vvk_photo_"+searchTerm;

 try{
  const saved=localStorage.getItem(cacheKey);
  if(saved){
   const cached=JSON.parse(saved);
   if(cached.src && cached.page)return cached;
  }
 }catch(e){}

 const params=new URLSearchParams({
  action:"query",
  generator:"search",
  gsrsearch:"filetype:bitmap "+searchTerm,
  gsrnamespace:"6",
  gsrlimit:"5",
  prop:"imageinfo",
  iiprop:"url",
  iiurlwidth:"480",
  format:"json",
  origin:"*"
 });

 const response=await fetch(
  "https://commons.wikimedia.org/w/api.php?"+params
 );

 if(!response.ok)throw new Error("Image search failed");

 const data=await response.json();
 const pages=Object.values(data.query?.pages||{});

 for(const p of pages){
  const info=p.imageinfo?.[0];

  if(info?.thumburl && !/\.svg(\?|$)/i.test(info.thumburl)){
   const result={
    src:info.thumburl,
    page:info.descriptionurl,
    title:p.title
   };

   try{
    localStorage.setItem(cacheKey,JSON.stringify(result));
   }catch(e){}

   return result;
  }
 }

 throw new Error("No photo found");
}

async function showVehicle(){
 const v=filtered[current];
 if(!v)return;

 loading.style.display="block";
 loading.textContent="तस्वीर लोड हो रही है...";
 creditEl.textContent="";

 nameEl.textContent=v[0];
 hindiEl.textContent=v[1];
 descEl.textContent=v[2];

 document.getElementById("counter").textContent=
  "Vehicle "+(current+1)+" / "+filtered.length;

 document.getElementById("learned").textContent=learnedSet.size;
 document.getElementById("total").textContent=vehicles.length;

 try{
  const result=await findPhoto(v[4]);

  if(filtered[current]!==v)return;

  const newImage=new Image();

  newImage.onload=()=>{
   if(filtered[current]!==v)return;

   photo.src=result.src;
   photo.style.display="block";
   photo.style.objectFit="contain";
   loading.style.display="none";
  };

  newImage.onerror=()=>{
   if(filtered[current]!==v)return;
   loading.textContent="फोटो लोड नहीं हुई। Retry करें।";
  };

  newImage.src=result.src;

  const link=document.createElement("a");
  link.href=result.page;
  link.target="_blank";
  link.rel="noopener";
  link.textContent="Photo source: Wikimedia Commons";
  creditEl.appendChild(link);

 }catch(e){
  if(filtered[current]!==v)return;

  loading.style.display="block";
  loading.textContent="फोटो नहीं मिली। फिर कोशिश करें।";

  const retry=document.createElement("button");
  retry.className="btn";
  retry.textContent="Retry Photo";
  retry.onclick=showVehicle;
  creditEl.appendChild(retry);
 }
}

function nextVehicle(){
 current=(current+1)%filtered.length;
 showVehicle();
}
function previousVehicle(){
 current=(current-1+filtered.length)%filtered.length;
 showVehicle();
}

function speak(text,lang){
 if(!("speechSynthesis" in window)){
  alert("इस browser में voice support उपलब्ध नहीं है।");
  return;
 }
 speechSynthesis.cancel();
 lastSpeech=text;
 const msg=new SpeechSynthesisUtterance(text);
 msg.lang=lang;
 msg.rate=0.88;
 msg.pitch=1.05;
 speechSynthesis.speak(msg);
}
function askMe(){
 speak("Hello kids! What is this? बच्चों, बताओ यह क्या है?","hi-IN");
}
function tellMe(){
 const v=filtered[current];
 learnedSet.add(v[0]);
 document.getElementById("learned").textContent=learnedSet.size;
 speak("This is a "+v[0]+". हिंदी में इसे "+v[1]+" कहते हैं। "+v[2],"en-IN");
}
function repeatVoice(){
 if(lastSpeech)speak(lastSpeech,"en-IN");
 else tellMe();
}
function toggleAuto(){
 const b=document.getElementById("autoButton");
 if(autoTimer){
  clearInterval(autoTimer);autoTimer=null;
  b.textContent="▶ Auto Learning";
 }else{
  b.textContent="⏸ Stop Learning";
  tellMe();
  autoTimer=setInterval(()=>{nextVehicle();setTimeout(tellMe,900)},6500);
 }
}

function newQuiz(){
 const correct=vehicles[Math.floor(Math.random()*vehicles.length)];
 quizAnswer=correct;
 document.getElementById("quizQuestion").textContent=
  "इस वाहन का सही English नाम चुनिए: "+correct[1];

 const options=[correct];
 while(options.length<4){
  const x=vehicles[Math.floor(Math.random()*vehicles.length)];
  if(!options.includes(x))options.push(x);
 }
 options.sort(()=>Math.random()-0.5);

 const box=document.getElementById("quizOptions");
 box.innerHTML="";

 options.forEach(x=>{
  const b=document.createElement("button");
  b.className="option";
  b.textContent=x[0];
  b.onclick=()=>{
   if(x===quizAnswer){
    document.getElementById("quizResult").textContent="🎉 सही जवाब! Very good, superstar!";
    speak("Correct answer! Very good, superstar!","en-IN");
   }else{
    document.getElementById("quizResult").textContent="Try again, champ! फिर कोशिश करो।";
    speak("Try again, champ!","en-IN");
   }
  };
  box.appendChild(b);
 });
 document.getElementById("quizResult").textContent="";
}

makeTabs();
document.getElementById("total").textContent=vehicles.length;
showVehicle();
newQuiz();
</script>
</body>
</html>
